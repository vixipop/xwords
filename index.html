<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Word Gazette &middot; A Free Crossword</title>

  <!-- Masthead face (Manufacturing Consent) is self-hosted in css/style.css.
       Still PLACEHOLDER via Google Fonts: bold serif headers, a distressed
       typewriter for printed body/clues, and a handwritten face for the pencil. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="stage">
    <div class="paper">
      <header class="masthead">
        <h1 class="masthead__title">The Word Gazette</h1>

        <!-- Toolbar: settings, timer, actions. -->
        <div class="toolbar">
          <div class="toolbar__left">
            <button class="tool tool--icon" id="settings-btn" title="Settings" aria-label="Settings"></button>
            <button class="tool" id="archive-btn" title="Browse past issues">Older Issues</button>
          </div>

          <div class="toolbar__center">
            <button class="tool tool--icon" id="timer-toggle" title="Pause / play" aria-label="Pause or play timer"></button>
            <span id="timer" class="timer">0:00</span>
            <button class="tool tool--icon" id="timer-reset" title="Reset timer" aria-label="Reset timer"></button>
          </div>

          <div class="toolbar__right">
            <div class="menu" data-menu>
              <button class="tool menu__btn">Check<span class="caret"></span></button>
              <div class="menu__list" role="menu">
                <button class="menu__item" data-toggle="autocheck" role="menuitemcheckbox">
                  <span class="tick" data-autocheck-ind></span>Autocheck
                </button>
                <div class="menu__sep"></div>
                <button class="menu__item" data-act="check:letter">Check Letter</button>
                <button class="menu__item" data-act="check:word">Check Word</button>
                <button class="menu__item" data-act="check:puzzle">Check Puzzle</button>
              </div>
            </div>

            <div class="menu" data-menu>
              <button class="tool menu__btn">Reveal<span class="caret"></span></button>
              <div class="menu__list" role="menu">
                <button class="menu__item" data-act="reveal:letter">Reveal Letter</button>
                <button class="menu__item" data-act="reveal:word">Reveal Word</button>
                <button class="menu__item" data-act="reveal:puzzle">Reveal Puzzle</button>
              </div>
            </div>

            <div class="menu" data-menu>
              <button class="tool menu__btn">Clear<span class="caret"></span></button>
              <div class="menu__list" role="menu">
                <button class="menu__item" data-act="clear:letter">Clear Letter</button>
                <button class="menu__item" data-act="clear:word">Clear Word</button>
                <div class="menu__sep"></div>
                <button class="menu__item" data-act="clear:puzzle">Clear Puzzle</button>
                <button class="menu__item" data-act="clear:puzzle+timer">Clear Puzzle &amp; Timer</button>
              </div>
            </div>
          </div>
        </div>
      </header>

      <div class="puzzle__head">
        <h2 id="puzzle-title">The Daily Crossword</h2>
      </div>

      <!-- ===== Three columns: Down | Puzzle | Across ===== -->
      <main class="edition">
        <section class="clues clues--down">
          <h3 class="clues__head">Down</h3>
          <ol id="clues-down" class="clues__list"></ol>
        </section>

        <section class="puzzle">
          <!-- Selected-word hint aligns with the Down / Across headings, above the grid.
               Prev/next arrows make it a clue navigator (essential on mobile). -->
          <div class="cluebar">
            <button class="cluebar__nav" id="clue-prev" aria-label="Previous clue" type="button">&lsaquo;</button>
            <span id="cluebar" class="cluebar__text" aria-live="polite"></span>
            <button class="cluebar__nav" id="clue-next" aria-label="Next clue" type="button">&rsaquo;</button>
          </div>
          <div class="grid-wrap">
            <div id="grid" class="grid" role="grid" aria-label="Crossword grid"></div>
          </div>
        </section>

        <section class="clues clues--across">
          <h3 class="clues__head">Across</h3>
          <ol id="clues-across" class="clues__list"></ol>
        </section>
      </main>
    </div>
  </div>

  <!-- Mobile only: fixed clue bar + on-screen keyboard (built in app.js) -->
  <div id="mobile-bar" aria-hidden="true">
    <div class="mclue">
      <button class="mclue__nav" id="mclue-prev" aria-label="Previous clue" type="button">&lsaquo;</button>
      <span id="mobile-clue" class="mclue__text"></span>
      <button class="mclue__nav" id="mclue-next" aria-label="Next clue" type="button">&rsaquo;</button>
    </div>
    <div class="keyboard" id="keyboard"></div>
  </div>

  <script src="js/app.js" type="module"></script>
</body>
</html>
